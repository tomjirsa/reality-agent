[project]
name = "reality-agent"
version = "0.1.0"
description = "Self-hosted real estate monitor for sreality.cz"
authors = [
    {name = "Tom Jirsik", email = "tom.jirsik@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "sqlalchemy>=2.0.30,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "alembic>=1.13.1,<2.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-multipart (>=0.0.29,<0.0.30)",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry]
packages = [
    {include = "shared"},
    {include = "scraper"},
    {include = "analyzer"},
    {include = "dashboard"},
]
