services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reality
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    ports:
      - "446:8080"
    depends_on:
      db:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
